<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Beautiful Purple-Blue Gradient -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Outer Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#ai-grad)" stroke-width="15" opacity="0.3" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#ai-grad)" stroke-width="8" stroke-dasharray="80 30" />

  <!-- Inner Tech Nodes -->
  <circle cx="250" cy="250" r="170" fill="#1e1e24" />
  
  <!-- Neural Network Connections -->
  <path d="M 180 200 L 320 200 L 250 320 Z" fill="none" stroke="#4f46e5" stroke-width="6" opacity="0.5"/>
  <circle cx="180" cy="200" r="12" fill="#a855f7" />
  <circle cx="320" cy="200" r="12" fill="#3b82f6" />
  <circle cx="250" cy="320" r="12" fill="#06b6d4" />

  <!-- TB Text (ThinkBot) -->
  <text x="250" y="275" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#ffffff" text-anchor="middle" letter-spacing="5">TB</text>
</svg>
